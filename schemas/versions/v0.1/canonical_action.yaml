# schemas/canonical_action.yaml
#
# Canonical Action — v0.1
#
# Represents a response or case-management action taken (or intended) by
# an analyst, SOCForge, or an automated workflow. Actions answer the
# question "what did we do about it?" — distinct from alerts (what was
# detected), cases (what investigation groups the alerts), and entities
# (who/what was involved).
#
# Model: EVENT LOG, not stateful object.
#   Each record is a STATE TRANSITION of a logical action, not the action
#   itself. The logical action is identified by action_id; its transitions
#   share that action_id and are ordered by occurred_at.
#
#   Rationale:
#     - Matches the event-based philosophy of canonical_alert.
#     - Preserves full audit history (essential for disruptive actions).
#     - Append-only: no concurrent-update corruption.
#     - "Current state" is a fold over transitions, materializable in v0.2.
#
# Design principles (from Day 3 decisions):
#   1. Recording an action is NOT the same as executing it. Proposed,
#      approved, rejected, executed, failed, and cancelled are distinct.
#   2. The schema records THAT an action was executed, not the mechanism.
#      Execution belongs to an adapter/execution layer.
#   3. An action MAY be case-scoped or standalone. If standalone,
#      rationale is required — see invariant.
#   4. Detected behavior is NOT modeled here. It lives in
#      canonical_alert.event_type.

version: "0.1"
schema_name: canonical_action

# ---------------------------------------------------------------------------
# Required fields
# ---------------------------------------------------------------------------

required:

  id:
    type: string
    description: >
      Unique identifier for THIS STATE TRANSITION, not the logical action.
      Two transitions of the same logical action share an action_id but
      have different ids.
    format: opaque

  action_id:
    type: string
    description: >
      Identifier for the LOGICAL ACTION. All transitions of the same
      action share this value. To reconstruct the action's history,
      query all records with the same action_id ordered by occurred_at.
    format: opaque

  tenant_id:
    type: string
    description: >
      Tenant that owns this action. MUST match the tenant_id of the
      associated case (if any) and of every target entity.
    resolution: trusted_context_only
    on_unresolved: quarantine

  occurred_at:
    type: string
    format: date-time
    description: >
      When THIS transition happened. NOT the time the action was
      first proposed — that is the occurred_at of the first transition.
      Ordering of transitions is by this field.

  state:
    type: string
    enum:
      - proposed