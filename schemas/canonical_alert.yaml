# schemas/canonical_alert.yaml
#
# Canonical Alert — v0.1
#
# Represents a single normalized alert, independent of source SIEM/EDR.
# Derived from 10 synthesized Wazuh SSH fixtures (adapters/siem/wazuh/fixtures/).
# Every required/optional decision below is justified by fixture evidence.
#
# Design principle: one alert = one event. Correlation across events is a
# CASE-level concern (see canonical_case.yaml), not an alert-level concern.

version: "0.1"
schema_name: canonical_alert

# ---------------------------------------------------------------------------
# Required fields
# ---------------------------------------------------------------------------
# Present in all 10 fixtures, OR injected by trusted adapter context.
# Absence indicates a malformed alert, not a legitimate variation.
# Adapters MUST populate these or reject/quarantine the alert.
# ---------------------------------------------------------------------------

required:

  id:
    type: string
    description: >
      Stable, globally unique identifier for this alert instance.
      Sourced from the adapter's native event ID where available
      (Wazuh: top-level `id`, e.g. "1730000122.482910").
    format: opaque
    evidence: "Present in all 10 fixtures."

  tenant_id:
    type: string
    description: >
      Tenant that owns this alert. Injected by trusted adapter
      configuration or ingestion context, never inferred from
      untrusted event content.
    required: true
    resolution: trusted_context_only
    on_unresolved: quarantine
    evidence: >
      Absent from all 10 fixtures by design — Wazuh does not emit tenant
      identity. Presence is enforced at the adapter boundary, not derived
      from payload.

  timestamp:
    type: string
    format: date-time
    description: >
      Event time in ISO 8601 / RFC 3339 UTC. Sourced from the source
      system's event timestamp, NOT ingestion time.
      Wazuh source: top-level `timestamp`.
    evidence: "Present in all 10 fixtures."

  source_adapter:
    type: string
    enum_hint: ["wazuh", "splunk", "sentinel", "elastic", "..."]
    description: >
      Identifier of the adapter that produced this canonical alert.
      Enables traceability and adapter-specific replay.
    evidence: "Implicit in fixture provenance; must be explicit downstream."

  event_type:
    type: string
    enum:
      - auth_failure
      - auth_success
      - brute_force_detected
    description: >
      Normalized classification of what happened. Distinct from raw rule ID.
      See notes for the 5760-vs-5712 distinction that drove this enum.
    evidence: >
      auth_failure         -> fixtures 01, 02, 03, 07, 08, 09 (rule 5760/5710)
      auth_success         -> fixture 05 (rule 5715)
      brute_force_detected -> fixtures 04, 06, 10 (rule 5712)

  source_ip:
    type: string
    format: ipv4-or-ipv6
    description: >
      Originating IP of the activity. IPv4 or IPv6 literal, no port.
      Wazuh source: `data.srcip`.
    evidence: "Present in all 10 fixtures — safe to require."

  severity:
    type: string
    enum: [informational, low, medium, high, critical]
    description: >
      Normalized severity of the EVENT. Distinct from case priority
      (see canonical_case.yaml). Adapters map native severity scales
      onto this enum. Wazuh mapping guidance (v0.1): level 0-3 ->
      informational, 4-6 -> low, 7-9 -> medium, 10-12 -> high, 13+ -> critical.
    evidence: >
      Wazuh rule.level observed: 3 (fixture 05), 5 (01,02,03,07,08,09),
      10 (04,06,10). Mapping above yields informational/low/high.

  target_system:
    type: string
    description: >
      The system on which the activity occurred, normalized to a stable
      identifier. Wazuh source: `agent.name` (preferred) with `agent.id`
      available as a fallback. Hostname is the canonical value.
    evidence: "Derivable from `agent` in all 10 fixtures."

  raw_ref:
    type: object
    description: >
      Pointer back to the original event, sufficient to retrieve it from
      the source system. Structured (not a URL string) so adapters can
      express native identifiers without inventing a URI scheme.
    properties:
      adapter:
        type: string
        description: Which adapter produced this ref.
      rule_id:
        type: string
        description: >
          Native rule/alert ID (Wazuh: `rule.id`). Preserved for
          traceability but NEVER used as the canonical classification —
          that is `event_type`'s job.
      event_id:
        type: string
        description: Native event identifier (Wazuh: top-level `id`).
      index_hint:
        type: string
        required: false
        description: >
          Optional index/location hint for retrieval
          (Wazuh: `location`, e.g. "/var/log/auth.log").
    evidence: >
      `rule.id` present in all 10; top-level `id` present in all 10;
      `location` present in all 10 (captured here as index_hint).

  raw_payload:
    type: object
    description: >
      The original, unmodified source event as received by the adapter.
      Opaque to downstream consumers; preserved for audit, replay, and
      schema evolution. Adapters MUST NOT prune unknown fields here.
    evidence: "The full Wazuh envelope is preserved in this field."

# ---------------------------------------------------------------------------
# Optional fields
# ---------------------------------------------------------------------------
# Absent in at least one fixture. Consumers MUST handle null/absent.
# ---------------------------------------------------------------------------

optional:

  target_user:
    type: string
    nullable: true
    description: >
      The account being acted upon or targeted. Wazuh source: `data.dstuser`.
      Nullable because some failure events do not identify a user
      (fixture 08). Consumers MUST NOT assume presence.
    evidence: >
      Present in 01-07, 09, 10. ABSENT in 08 (ssh-failure-no-user).
      This absence is why target_user is optional, not required.

  actor_user:
    type: string
    nullable: true
    description: >
      The account performing the action, when distinct from target_user.
      For SSH failures this is usually absent; for invalid-user attempts
      Wazuh populates `data.srcuser` with the attempted username, which
      mirrors dstuser rather than representing a separate actor.
    evidence: >
      `data.srcuser` present only in fixtures 02, 06, 10 — all invalid-user
      cases where it duplicates dstuser. Marked optional and distinct so
      future adapters with a genuine actor concept can use it.

  source_port:
    type: integer
    nullable: true
    description: >
      Originating TCP/UDP port. Wazuh source: `data.srcport` (string in
      raw payload; cast to integer here).
    evidence: "ABSENT in fixture 07 (ssh-failure-no-source-port)."

  protocol:
    type: string
    nullable: true
    description: >
      Application protocol of the activity. Wazuh source: `data.protocol`.
      Example value: "ssh2".
    evidence: >
      Present in all 10 fixtures, but marked optional because protocol is
      not guaranteed across non-SSH adapters and its presence here is an
      artifact of the SSH-only fixture set.

  enrichment:
    type: object
    nullable: true
    description: >
      Structured enrichment attached by the source system or downstream.
      In v0.1 the only observed member is `mitre`. Kept as an open object
      so future enrichment types don't force schema revisions.
    properties:
      mitre:
        type: object
        nullable: true
        description: >
          MITRE ATT&CK mapping. Wazuh source: `rule.mitre`.
        properties:
          id:
            type: array
            items: { type: string }
          tactic:
            type: array
            items: { type: string }
          technique:
            type: array
            items: { type: string }
    evidence: >
      `rule.mitre` present ONLY in fixture 10. This is the sole enrichment
      case in the fixture set, hence optional.

# ---------------------------------------------------------------------------
# Explicitly NOT modeled in v0.1
# ---------------------------------------------------------------------------
# Documenting omissions prevents silent schema drift. These were considered
# and deliberately deferred.
#
# - correlation metadata (rule.frequency, rule.timeframe):
#     Belongs to CASE-level grouping, not individual alerts. Fixtures 04,
#     06, 10 carry these on the rule, but they describe a correlation
#     window, not this event. Modeled in canonical_case.yaml instead.
#
# - confidence / risk score:
#     Not emitted by Wazuh in the fixture set. Defer until an adapter
#     provides it.
#
# - geo / ASN enrichment of source_ip:
#     Not emitted in the fixture set. Belongs in `enrichment` when it is.
#
# - case_id / correlation_id:
#     Cross-alert linkage. Belongs in canonical_case.yaml.
#
# - native rule ID as classification:
#     Explicitly rejected. `raw_ref.rule_id` preserves the native ID for
#     traceability, but `event_type` is the canonical classification.
#     Downstream consumers MUST NOT branch on rule_id.